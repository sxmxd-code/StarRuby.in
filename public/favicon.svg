<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gold Band Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#996515" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Ruby Gem Radial Glow -->
    <radialGradient id="rubyGlow" cx="38%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="35%" stop-color="#E11D48" />
      <stop offset="70%" stop-color="#AF0313" />
      <stop offset="95%" stop-color="#670008" />
      <stop offset="100%" stop-color="#3F0005" />
    </radialGradient>

    <!-- Subtle Ring Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Lower Ring Band -->
    <ellipse cx="32" cy="42" rx="21" ry="15" fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round" />
    
    <!-- Ring Band Inner Highlight -->
    <ellipse cx="32" cy="42" rx="21" ry="15" fill="none" stroke="#FEF3C7" stroke-width="2" stroke-dasharray="14 26" opacity="0.85" />

    <!-- Gem Prongs / Setting Base -->
    <path d="M19 28 L23 16 L41 16 L45 28 Z" fill="#996515" />
    <path d="M21 26 L24 17 L40 17 L43 26 Z" fill="url(#gold)" />

    <!-- Oval Star Ruby Gemstone -->
    <ellipse cx="32" cy="22" rx="15.5" ry="12.5" fill="url(#rubyGlow)" stroke="#FECDD3" stroke-width="1.2" />

    <!-- 6-Ray Star Asterism (Signature of Star Ruby) -->
    <!-- Vertical Ray -->
    <path d="M32 9.5 L32 34.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.95" />
    <path d="M32 12 L32 32" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.35" />
    
    <!-- Diagonal Ray 1 -->
    <path d="M20 15 L44 29" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
    
    <!-- Diagonal Ray 2 -->
    <path d="M20 29 L44 15" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />

    <!-- Center Star Core Glow -->
    <circle cx="32" cy="22" r="3" fill="#FFFFFF" opacity="0.98" />
    <circle cx="32" cy="22" r="6" fill="#FFE4E6" opacity="0.45" />

    <!-- Sparkle Glint on Top Prong -->
    <polygon points="44,14 46,9 48,14 53,16 48,18 46,23 44,18 39,16" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
